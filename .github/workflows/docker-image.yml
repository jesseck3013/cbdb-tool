name: Build image and push it to registry

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build_and_push:
    runs-on: ubuntu-latest

    steps:
    - name: Download SQLite Database
      run: |
          mkdir -p data
          curl -L https://huggingface.co/datasets/cbdb/cbdb-sqlite/resolve/main/latest.zip -o data/latest.zip
          unzip -o data/latest.zip -d data/
          rm data/latest.zip
          mv data/*.sqlite3 data/cbdb.sqlite3

    - name: unzip
      run: |
        curl -L https://huggingface.co/datasets/cbdb/cbdb-sqlite/resolve/main/latest.zip -o data/cbdb.sqlite3

    - name: Login to Registry
      uses: docker/login-action@v4
      with:
        registry: ${{ vars.FREEKICK_REGISTRY_URL }}
        username: ${{ vars.FREEKICK_REGISTRY_USER }}
        password: ${{ secrets.FREEKICK_REGISTRY_SEC }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        push: true
        context: .
        file: ./Dockerfile
        tags: |
          ${{ vars.FREEKICK_REGISTRY_DOMAIN }}/temp:latest
          ${{ vars.FREEKICK_REGISTRY_DOMAIN }}/temp:${{ github.sha }}
