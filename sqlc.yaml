version: "2"
sql:
  - engine: "sqlite"
    schema: "internal/query/schema.sql"
    queries: "internal/query/query.sql"

    gen:
      go:
        package: "repository"
        out: "internal/repository"
        overrides:
          - db_type: "smallint(6)"
            nullable: true
            go_type:
              type: "*int16"
          - db_type: "smallint(6)"
            go_type:
              type: "int16"
        emit_json_tags: true
        emit_pointers_for_null_types: true
